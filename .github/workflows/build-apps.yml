name: Build SmartToScreen apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer and host app
    runs-on: windows-latest
    steps:
      - name: Get SmartToScreen source
        uses: actions/checkout@v6

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build SmartToScreen host app
        shell: pwsh
        run: dotnet publish desktop-host/SmartToScreen.Host.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o build/host

      - name: Download official Sunshine Windows installer
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/LizardByte/Sunshine/releases/latest' -Headers @{ 'User-Agent' = 'SmartToScreen-build' }
          $asset = $release.assets | Where-Object { $_.name -eq 'Sunshine-Windows-AMD64-installer.msi' } | Select-Object -First 1
          if (-not $asset) { throw 'The official Sunshine Windows installer was not found in the latest release.' }
          New-Item -ItemType Directory -Force -Path build\vendor | Out-Null
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile build\vendor\Sunshine-Windows-AMD64-installer.msi
          "Sunshine version: $($release.tag_name)" | Out-File build\vendor\sunshine-version.txt -Encoding utf8

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Package SmartToScreen Windows setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc 'packaging\windows\SmartToScreen.iss' "/DHostDir=$PWD\build\host" "/DSunshineInstaller=$PWD\build\vendor\Sunshine-Windows-AMD64-installer.msi" "/O$PWD\build\windows"
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup could not create the Windows installer.' }

      - name: Upload Windows setup
        uses: actions/upload-artifact@v4
        with:
          name: SmartToScreen-Windows
          path: build/windows/SmartToScreen-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Get SmartToScreen build scripts
        uses: actions/checkout@v6

      - name: Get pinned Moonlight Android source
        uses: actions/checkout@v6
        with:
          repository: moonlight-stream/moonlight-android
          ref: v12.2
          path: moonlight
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: sdkmanager "ndk;29.0.14206865"

      - name: Install Android 17 preview platform
        run: sdkmanager --channel=3 "platforms;android-37"

      - name: Apply SmartToScreen app identity
        run: python packaging/android/rebrand-moonlight.py moonlight/app/build.gradle

      - name: Build Android APK
        working-directory: moonlight
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleNonRootDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartToScreen-Android
          path: moonlight/app/build/outputs/apk/nonRoot/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish paired downloads
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get release notes and license files
        uses: actions/checkout@v4

      - name: Download Windows setup
        uses: actions/download-artifact@v4
        with:
          name: SmartToScreen-Windows
          path: release

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: SmartToScreen-Android
          path: release

      - name: Add install notes and version file
        run: |
          mv release/app-nonRoot-debug.apk release/SmartToScreen-Android.apk
          cp THIRD-PARTY-NOTICES.md release/THIRD-PARTY-NOTICES.md
          cp LICENSE release/LICENSE-GPL-3.0.txt
          printf '%s\n' \
            'SmartToScreen apps' \
            '' \
            'Install SmartToScreen-Windows-Setup.exe on Windows 11 and SmartToScreen-Android.apk on Android.' \
            'The Android app finds the PC on the same local network. On first pairing it displays a temporary PIN; enter it in the Sunshine panel on the PC to approve this phone.' \
            'After pairing, the device is trusted until you remove it. For best latency, connect the PC by Ethernet and use 5 GHz Wi-Fi on Android.' \
            '' \
            'The Android client is based on Moonlight Android v12.2 (GPL-3.0). The PC installer includes the official Sunshine installer (GPL-3.0).' \
            > release/LEIA-PRIMEIRO.txt

      - name: Publish release downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: SmartToScreen beta 0.2.${{ github.run_number }}
          generate_release_notes: true
          files: release/*

